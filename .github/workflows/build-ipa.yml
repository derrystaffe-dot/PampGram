name: Build IPA (device, fake-signed)

# Manual only — this is a huge build (Telegram-iOS plus WebRTC/dav1d/libvpx/td from
# source).
# Run it from the Actions tab when you actually want a new .ipa.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 350

    steps:
      - name: Check out PampGram (patch + PhantomGiftKit)
        uses: actions/checkout@v4
        with:
          path: pampgram

      - name: Check out Telegram-iOS
        run: |
          git clone --recursive --shallow-submodules -j8 \
            https://github.com/TelegramMessenger/Telegram-iOS.git telegram-ios
          cd telegram-ios
          git checkout release-11.14.1
          git submodule update --init --recursive

      - name: Apply the PampGram patch
        working-directory: telegram-ios
        run: |
          git apply --check ../pampgram/mod/telegram-ios.patch
          git apply ../pampgram/mod/telegram-ios.patch
          mkdir -p submodules/TelegramUI/Components/PampGram
          cp -R ../pampgram/mod/components/. submodules/TelegramUI/Components/PampGram/
          # The visual profile state is rendered in Telegram's profile screen by this
          # anchor-checked post-patch, after the base PampGram patch is in place.
          python3 ../pampgram/mod/apply-profile-visuals.py
          ls -1 submodules/TelegramUI/Components/PampGram

      - name: Prepare build config
        working-directory: telegram-ios
        run: |
          mkdir -p build-input
          cat > build-input/data.json << 'EOF'
          {
            "bundle_id": "org.telegram.Telegram-iOS",
            "api_id": "8",
            "api_hash": "7245de8e747a0d6fbe11f7cc14fcc0bb",
            "team_id": "XXXXXXXXXX",
            "app_center_id": "",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

      - name: Build IPA
        working-directory: telegram-ios
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            generate \
            --configurationPath=build-input/data.json \
            --configuration=release_arm64 \
            --buildNumber=10000 \
            --xcodeManagedCodesigning

          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-input/data.json \
            --configuration=release_arm64 \
            --buildNumber=10000 \
            --xcodeManagedCodesigning

      - name: Package IPA
        working-directory: telegram-ios
        run: |
          # Ищем собранный .app
          APP_PATH=$(find bazel-out -name "Telegram.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Telegram.ipa Payload
          
          ls -lh Telegram.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PampGram-ipa
          path: telegram-ios/Telegram.ipa
          if-no-files-found: error
