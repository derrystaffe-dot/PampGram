name: Build IPA (device, fake-signed)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 350

    steps:
      - name: Check out PampGram
        uses: actions/checkout@v4
        with:
          path: pampgram

      - name: Check out Telegram-iOS (release-12.8)
        run: |
          git clone --recursive -j8 https://github.com/TelegramMessenger/Telegram-iOS.git telegram-ios
          cd telegram-ios
          git checkout release-12.8
          git submodule update --init --recursive

      - name: Apply the PampGram patch
        working-directory: telegram-ios
        run: |
          echo "=== Применяем патч ==="
          git apply --reject --whitespace=fix ../pampgram/mod/telegram-ios.patch || true
          
          mkdir -p submodules/TelegramUI/Components/PampGram
          cp -R ../pampgram/mod/components/. submodules/TelegramUI/Components/PampGram/
          
          if [ -f ../pampgram/mod/apply-profile-visuals.py ]; then
            python3 ../pampgram/mod/apply-profile-visuals.py || true
          fi
          
          echo "=== Компоненты PampGram ==="
          ls -la submodules/TelegramUI/Components/PampGram

      - name: Prepare fake codesigning
        working-directory: telegram-ios
        run: |
          mkdir -p build-input
          mkdir -p build-system/fake-codesigning/profiles
          
          # Создаём все возможные профили, которые могут потребоваться
          for name in \
            Telegram \
            NotificationService \
            NotificationContent \
            Share \
            BroadcastUpload \
            Widget \
            Intents \
            ; do
            touch "build-system/fake-codesigning/profiles/${name}.mobileprovision"
            touch "build-system/fake-codesigning/profiles/${name}.mobileprovision.plist" || true
          done
          
          # Конфиг
          cat > build-input/data.json << 'EOF'
          {
            "bundle_id": "org.telegram.Telegram-iOS",
            "api_id": "8",
            "api_hash": "7245de8e747a0d6fbe11f7cc14fcc0bb",
            "team_id": "XXXXXXXXXX",
            "app_center_id": "",
            "is_internal_build": "true",
            "is_appstore_build": "false",
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF
          
          ls -la build-system/fake-codesigning/profiles/

      - name: Generate project
        working-directory: telegram-ios
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            generateProject \
            --configurationPath=build-input/data.json \
            --configuration=release_arm64 \
            --buildNumber=10000 \
            --xcodeManagedCodesigning || true

      - name: Build
        working-directory: telegram-ios
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-input/data.json \
            --configuration=release_arm64 \
            --buildNumber=10000 \
            --xcodeManagedCodesigning

      - name: Package IPA
        working-directory: telegram-ios
        run: |
          APP_PATH=$(find bazel-out -name "Telegram.app" -type d | head -1 || true)
          echo "Found app: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "Telegram.app не найден. Ищем любые .app:"
            find bazel-out -name "*.app" -type d | head -30 || true
            exit 1
          fi
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Telegram.ipa Payload
          ls -lh Telegram.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PampGram-ipa
          path: telegram-ios/Telegram.ipa
          if-no-files-found: error
