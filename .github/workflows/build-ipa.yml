name: Build IPA (device, fake-signed)

# Manual only — this is a huge build (Telegram-iOS plus WebRTC/dav1d/libvpx/td from
# source). Run it from the Actions tab when you actually want a new .ipa.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350 # under the 6h hosted-runner cap
    steps:
      - name: Check out PampGram (patch + PhantomGiftKit)
        uses: actions/checkout@v4
        with:
          path: pampgram

      # Telegram-iOS pins Xcode 26.2. Keeping the runner on that exact toolchain avoids
      # compiler crashes caused by mixing a newer Xcode with the upstream Bazel cache.
      - name: Select Xcode 26.2
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_26.2.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "FAIL: Xcode 26.2 is not installed on this runner. Available Xcodes:"
            ls -1 /Applications | grep -i '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Check out Telegram-iOS
        run: |
          git clone --recursive --shallow-submodules -j8 \
            https://github.com/TelegramMessenger/Telegram-iOS.git telegram-ios
          cd telegram-ios
          git checkout release-12.9.2

      # mod/components/* are whole new Bazel packages, dropped in as-is under a single
      # PampGram/ directory; mod/telegram-ios.patch only touches files that already exist
      # upstream. Keeping the two apart means editing our own Swift never requires
      # regenerating the patch.
      - name: Apply the PampGram patch
        working-directory: telegram-ios
        run: |
          git apply --check ../pampgram/mod/telegram-ios.patch
          git apply ../pampgram/mod/telegram-ios.patch
          mkdir -p submodules/TelegramUI/Components/PampGram
          cp -R ../pampgram/mod/components/. submodules/TelegramUI/Components/PampGram/
          # The visual profile state is rendered in Telegram's profile screen by this
          # anchor-checked post-patch, after the base PampGram patch is in place.
          python3 ../pampgram/mod/apply-profile-visuals.py
          ls -1 submodules/TelegramUI/Components/PampGram

      - name: Write build configuration
        working-directory: telegram-ios
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '8' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || '7245de8e747a0d6fbe11f7cc14fcc0bb' }}
        run: |
          cat > build-system/pampgram-configuration.json <<EOF
          {
            "bundle_id": "ph.telegra.Telegraph",
            "api_id": "${TELEGRAM_API_ID}",
            "api_hash": "${TELEGRAM_API_HASH}",
            "team_id": "C67CF9S4VU",
            "app_center_id": "",
            "is_appstore_build": false,
            "appstore_id": "",
            "official_app_store_id": "686449807",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF
          echo "Configuration written:"
          cat build-system/pampgram-configuration.json
      # Signing, the whole story in one place.
      #
      # Two separate problems had to be solved here, and the first one masked the second.
      #
      # (1) The shipped certs/SelfSigned.p12 is encrypted with pbeWithSHA1And40BitRC2-CBC —
      # 40-bit RC2 that modern OpenSSL refuses by default. We lower the security level just
      # long enough to import it into a temporary keychain.
      #
      # (2) codesign looks up the identity in the *login* keychain (or the system default
      # search list). A keychain created with `security create-keychain` is not on that list
      # unless we put it there. We import into a dedicated keychain and then unlock + add it
      # to the search list for the rest of the job.
      - name: Import self-signed identity for codesign
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/pampgram.keychain-db"
          KEYCHAIN_PASSWORD="pampgram"
          P12_PATH="telegram-ios/build-system/fake-codesigning/certs/SelfSigned.p12"
          # Empty password is what the Telegram repo uses for this self-signed cert.
          P12_PASSWORD=""

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Allow the weak 40-bit RC2 cipher that Apple's old self-signed p12 uses.
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Imported identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: telegram-bazel-cache-xcode-26.2-${{ github.run_id }}
          restore-keys: |
            telegram-bazel-cache-xcode-26.2-

      # A DEVICE build (release_arm64), signed with the self-signed cert + fake provisioning
      # profiles the Telegram repo ships in build-system/fake-codesigning for exactly this
      # purpose (README: "Copy build-system/fake-codesigning"). --codesigningInformationPath
      # only makes Make.py hand those *profiles* to Bazel; putting the matching identity
      # where codesign can find it is the previous step's job, not Make.py's.
      #
      # The resulting signature is NOT valid for installing on a real iPhone as-is. That's
      # fine and expected: Sideloadly / AltStore / an on-device signer strip it and re-sign
      # with YOUR Apple ID at install time. They only need a structurally valid device .ipa,
      # which is what this produces.
      - name: Build device IPA (fake-signed)
        working-directory: telegram-ios
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/pampgram-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=1 \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$GITHUB_WORKSPACE/output"

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: telegram-bazel-cache-xcode-26.2-${{ github.run_id }}

      - name: Show what was produced
        if: always()
        run: ls -lh "$GITHUB_WORKSPACE/output" || echo "no output directory — the build did not reach packaging"

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PampGram-ipa
          path: output/Telegram.ipa
          if-no-files-found: warn
          retention-days: 14
